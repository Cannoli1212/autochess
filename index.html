<meta charset="utf-8" />
<title>Autochess — 7-Round Mode</title>

<!-- Web hosts (GitHub Pages, Netlify, etc.) serve the file named index.html when
     someone visits the bare folder URL. The real game lives in game.html, so this
     file's only job is to bounce visitors straight there. Keeping the game in
     game.html means every doc, bookmark and ?v=legNN reload habit still works. -->
<meta http-equiv="refresh" content="0; url=game.html" />

<!-- Shown only if the auto-redirect is blocked (rare, but never leave a dead end). -->
<body style="background:#1e1e1e;color:#eaeaea;font-family:Arial,sans-serif;margin:40px">
  <p>Loading the game… <a href="game.html" style="color:#7fd1ff">click here if nothing happens</a>.</p>
</body>
